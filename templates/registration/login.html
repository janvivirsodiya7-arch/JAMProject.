{% extends "registration/base.html" %}

{% load crispy_forms_tags %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100 p-0">

        <div class="col-12 col-sm-10 col-md-6 col-lg-4 col-xl-4">

            <div class="card shadow border-0 rounded-4 p-0">

                <div class="card-body">

                    <div class="text-center mb-2">

                        <h2 class="fw-bold">
                            Doctor App
                        </h2>

                        <p class="text-muted">
                            Login to your account
                        </p>

                    </div>


                    <form method="post">

                        {% csrf_token %}

                        {{ form|crispy }}

                        <div class="d-grid mt-4">

                            <button type="submit" class="btn btn-theme rounded-3">
                                Login
                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-4">
                        <small>
                        <span>No account. <a href="{% url 'core:register' 'patient' %}" class="text-decoration-none">
                            Signup
                        </a></span> /
                        <a href="{% url 'password_reset' %}" class="text-decoration-none">
                            Forgot password?
                        </a>
                        </small>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
